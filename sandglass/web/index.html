<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" id="meta-description" content="本机 Claude、Codex、Grok 额度与用量。" />
  <meta name="color-scheme" content="light dark" />
  <title>sandglass</title>
  <link rel="icon" href="favicon.png" type="image/png" />
  <style>
    /* CodexBar menu card, static polish via redesign-existing-projects */
    @font-face {
      font-family: Geist;
      src: url("fonts/Geist-Variable.woff2") format("woff2");
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }
    :root {
      --bg: #f6f3ec;
      --text: #1c1b19;
      --muted: #6b6964;
      --faint: #706d67;
      --ink: var(--text);
      --card: #ffffff;
      --line: rgba(28, 27, 25, .08);
      --track: rgba(28, 27, 25, .08);
      --hover: rgba(28, 27, 25, .045);
      --sel: #007aff;
      --claude: #c96442;
      --codex: #0f766e;
      --grok: #111111;
      --hot: #c4473d;
      --fresh: #2f8f4e;
      --card-w: 380px;
      --pad-x: 20px;
      --ease: cubic-bezier(.22, 1, .36, 1);
      --shadow: 48, 40, 28;
      --z-skip: 10;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1917;
        --text: #f5f3ee;
        --muted: #a39e96;
        --faint: #969189;
        --card: #2a2926;
        --line: rgba(255, 248, 238, .10);
        --track: rgba(255, 248, 238, .12);
        --hover: rgba(255, 248, 238, .06);
        --sel: #0a84ff;
        --claude: #d98968;
        --codex: #3ec5b6;
        --grok: #f5f3ee;
        --hot: #d45b54;
        --fresh: #4cc27a;
        --shadow: 0, 0, 0;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100dvh; }
    html { color-scheme: light dark; }
    html, body { scrollbar-width: none; }
    html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }
    html.overview-mode,
    html.overview-mode body {
      height: 100dvh;
      min-height: 0;
      overflow: hidden;
    }
    body {
      font-family: Geist, "SF Pro Text", "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    .skip {
      position: absolute;
      left: 12px;
      top: 12px;
      z-index: var(--z-skip);
      padding: 8px 12px;
      border-radius: 8px;
      background: var(--text);
      color: var(--bg);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      transform: translateY(-160%);
    }
    .skip:focus { transform: none; }
    .popover {
      position: relative;
      width: min(var(--card-w), calc(100% - 24px));
      margin: 32px auto 64px;
      padding-top: 32px;
      background: var(--card);
      border-radius: 16px;
      box-shadow:
        0 10px 36px rgba(var(--shadow), .10),
        0 0 0 0.5px rgba(var(--shadow), .06);
      overflow: hidden;
    }
    html.overview-mode .popover {
      display: flex;
      flex-direction: column;
      max-height: calc(100dvh - 96px);
    }
    html.overview-mode .body {
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }
    .body.tab-enter,
    .menu.tab-enter {
      animation: tab-enter .18s var(--ease) both;
    }
    @keyframes tab-enter {
      from { opacity: .58; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .tabs {
      display: flex;
      align-items: stretch;
      gap: 2px;
      padding: 8px 10px 7px;
      border-bottom: 0.5px solid var(--line);
    }
    .app-menu-shell {
      position: absolute;
      z-index: 20;
      top: 0;
      left: 10px;
      height: 32px;
      display: flex;
      align-items: center;
    }
    .app-menu-button {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      padding: 0;
      appearance: none;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: background .18s var(--ease), color .18s var(--ease);
    }
    .app-menu-button:hover,
    .app-menu-button[aria-expanded="true"] {
      background: var(--hover);
      color: var(--text);
    }
    .app-menu-button svg { width: 18px; height: 18px; display: block; }
    .app-menu-panel {
      position: absolute;
      top: 32px;
      left: 0;
      width: 224px;
      padding: 7px;
      border: .5px solid var(--line);
      border-radius: 12px;
      background: var(--card);
      box-shadow: 0 12px 30px rgba(var(--shadow), .18);
    }
    .app-menu-title {
      padding: 5px 8px 6px;
      color: var(--faint);
      font-size: 11px;
      line-height: 14px;
      font-weight: 700;
      letter-spacing: .03em;
    }
    .app-menu-item,
    .language-option {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      padding: 7px 8px;
      appearance: none;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 13px;
      line-height: 18px;
      text-align: left;
      white-space: nowrap;
      cursor: pointer;
    }
    .app-menu-item:hover,
    .language-option:hover { background: var(--hover); }
    .app-menu-item .menu-value {
      min-width: 0;
      margin-left: auto;
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .app-menu-item .menu-chevron {
      width: 12px;
      height: 12px;
      flex: 0 0 12px;
      color: var(--faint);
      transition: transform .16s var(--ease);
    }
    .app-menu-item[aria-expanded="true"] .menu-chevron { transform: rotate(180deg); }
    .app-menu-item svg {
      width: 14px;
      height: 14px;
      flex: 0 0 14px;
    }
    .app-menu-divider {
      height: .5px;
      margin: 6px 4px 3px;
      background: var(--line);
    }
    .app-menu-options {
      margin: 2px 0 2px 8px;
      padding-left: 4px;
      border-left: 2px solid var(--line);
      max-height: 252px;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: none;
    }
    .app-menu-options::-webkit-scrollbar {
      display: none;
    }
    .language-option .check {
      width: 14px;
      flex: 0 0 14px;
      color: var(--sel);
      font-weight: 800;
      text-align: center;
    }
    .help-view {
      position: relative;
      isolation: isolate;
      min-height: 420px;
      padding: 2px 0 10px;
    }
    .help-view:focus { outline: none; }
    .help-view::before {
      content: "";
      position: absolute;
      z-index: -2;
      inset: -42px -58px -28px;
      background:
        radial-gradient(180px 150px at 8% 20%, color-mix(in srgb, var(--codex) 14%, transparent), transparent 74%),
        radial-gradient(220px 170px at 94% 84%, color-mix(in srgb, var(--sel) 10%, transparent), transparent 78%);
      filter: blur(26px) saturate(1.08);
      opacity: .62;
      pointer-events: none;
      animation: help-aurora 12s ease-in-out infinite alternate;
    }
    .help-view::after {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 42px -12px 0;
      border-radius: 30px;
      background: linear-gradient(145deg, rgba(255,255,255,.12), transparent 46%, rgba(255,255,255,.05));
      pointer-events: none;
    }
    @keyframes help-aurora {
      from { transform: translate3d(-5px, -3px, 0) scale(1); }
      to { transform: translate3d(7px, 5px, 0) scale(1.035); }
    }
    .help-view .head {
      position: relative;
      z-index: 1;
      margin-bottom: 14px;
    }
    .help-view .head h1 { flex-wrap: nowrap; }
    .help-view .head .logo {
      flex: 0 0 30px;
      width: 30px;
      height: 30px;
      min-width: 30px;
    }
    .help-view .head h1 .name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .help-sections {
      position: relative;
      z-index: 1;
      display: grid;
      overflow: hidden;
      padding: 3px 13px;
      border: 1px solid color-mix(in srgb, var(--text) 9%, transparent);
      border-radius: 18px;
      background: linear-gradient(145deg,
        color-mix(in srgb, var(--card) 62%, transparent),
        color-mix(in srgb, var(--card) 38%, transparent));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.58), 0 16px 36px -28px rgba(var(--shadow), .5);
      -webkit-backdrop-filter: blur(22px) saturate(1.24);
      backdrop-filter: blur(22px) saturate(1.24);
    }
    .help-section {
      position: relative;
      padding: 12px 2px;
      border: 0;
      background: transparent;
      transition: background .18s var(--ease);
    }
    .help-section + .help-section::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: color-mix(in srgb, var(--text) 7%, transparent);
    }
    .help-section:hover {
      background: color-mix(in srgb, var(--text) 2.5%, transparent);
    }
    .help-section h2 {
      position: relative;
      margin: 0 0 3px;
      font-size: 13px;
      line-height: 17px;
      font-weight: 700;
    }
    .help-section p {
      position: relative;
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 18px;
      overflow-wrap: anywhere;
    }
    .help-advanced {
      position: relative;
      z-index: 1;
      margin-top: 12px;
      padding: 10px;
      border: 1px solid color-mix(in srgb, var(--text) 9%, transparent);
      border-radius: 15px;
      background: linear-gradient(145deg,
        color-mix(in srgb, var(--card) 64%, transparent),
        color-mix(in srgb, var(--card) 38%, transparent));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.56), 0 10px 26px -22px rgba(var(--shadow), .48);
      -webkit-backdrop-filter: blur(20px) saturate(1.3);
      backdrop-filter: blur(20px) saturate(1.3);
      transition: border-color .2s var(--ease), box-shadow .2s var(--ease), background .2s var(--ease);
    }
    .help-advanced.open {
      border-color: color-mix(in srgb, var(--text) 14%, transparent);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.65), 0 16px 36px -26px rgba(var(--shadow), .58);
    }
    .help-advanced-toggle {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      margin: 0;
      padding: 10px 34px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 16px;
      line-height: 22px;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
    }
    .help-advanced-toggle:focus-visible {
      outline: 2px solid color-mix(in srgb, var(--sel) 58%, transparent);
      outline-offset: -1px;
    }
    .help-advanced-toggle::after {
      content: "";
      position: absolute;
      right: 15px;
      width: 5px;
      height: 5px;
      margin-top: -1px;
      border-right: 1.5px solid currentColor;
      border-bottom: 1.5px solid currentColor;
      transform: rotate(45deg);
    }
    .help-advanced-toggle[aria-expanded="true"]::after {
      margin-top: 2px;
      transform: rotate(-135deg);
    }
    .help-advanced-body {
      display: grid;
      justify-items: center;
      gap: 12px;
      margin-top: 6px;
      padding: 14px 12px 10px;
      border-top: 1px solid color-mix(in srgb, var(--text) 8%, transparent);
      text-align: center;
    }
    .help-advanced-body p {
      margin: 0;
      max-width: 100%;
      justify-self: stretch;
      color: var(--muted);
      font-size: 13px;
      line-height: 19px;
      overflow-wrap: anywhere;
    }
    .help-advanced-body p.help-advanced-next {
      color: var(--faint);
      font-size: 12px;
      line-height: 18px;
      text-decoration: none;
    }
    .help-advanced-body .help-action { margin-top: 0; }
    .help-action {
      min-width: 152px;
      margin-top: 0;
      padding: 10px 22px;
      border: 0;
      border-radius: 8px;
      background: linear-gradient(135deg,
        color-mix(in srgb, var(--codex) 90%, white 10%),
        color-mix(in srgb, var(--codex) 72%, var(--sel) 28%));
      color: white;
      font: inherit;
      font-size: 14px;
      line-height: 20px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.28), 0 8px 16px -10px color-mix(in srgb, var(--codex) 74%, transparent);
      transition: filter 120ms var(--ease), transform 120ms var(--ease), box-shadow 120ms var(--ease);
    }
    .help-action:hover { filter: brightness(1.06); transform: translateY(-1px); }
    .help-action:active { filter: brightness(.92); transform: translateY(0) scale(.985); }
    .help-action.is-copied,
    .help-action.is-copied:hover { filter: brightness(1.14); }
    .help-action:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    .tabs button {
      flex: 1 1 0;
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      padding: 7px 4px 5px;
      border-radius: 10px;
      font: inherit;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .01em;
      line-height: 13px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      min-width: 0;
      transition: background .22s var(--ease), color .22s var(--ease), transform .18s var(--ease), box-shadow .22s var(--ease);
    }
    .tabs button:not(.on):hover { background: var(--hover); color: var(--text); }
    .tabs button:active { transform: scale(.98); }
    .tabs button svg { width: 30px; height: 30px; display: block; }
    .tab-label {
      display: block;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .logo {
      width: 30px;
      height: 30px;
      display: block;
      flex: 0 0 auto;
      background: center / contain no-repeat;
    }
    .logo.codex {
      background-image: url("icons/ProviderIcon-codex.png");
    }
    .logo.claude {
      background-image: url("icons/ProviderIcon-claude.png");
    }
    .logo.grok {
      background-image: url("icons/ProviderIcon-grok.png");
    }
    .logo.sandglass {
      background-image: url("assets/logo-mark.png");
    }
    @media (prefers-color-scheme: dark) {
      .logo.grok { filter: invert(1); }
    }
    .tabs button.on .logo { filter: brightness(0) invert(1); }
    .tabs .mark {
      width: 18px;
      height: 2px;
      border-radius: 2px;
      background: var(--track);
      overflow: hidden;
      margin-top: 1px;
    }
    .tabs .mark.claude { background: color-mix(in srgb, var(--claude) 28%, var(--card)); }
    .tabs .mark.codex { background: color-mix(in srgb, var(--codex) 28%, var(--card)); }
    .tabs .mark.grok { background: color-mix(in srgb, var(--grok) 14%, var(--card)); }
    .tabs .mark i {
      display: block;
      width: 100%;
      height: 2px;
      border-radius: 2px;
      transform: scaleX(var(--fill, 0));
      transform-origin: left center;
    }
    .tabs button.on {
      background: var(--sel);
      color: #fff;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.28),
        0 6px 14px -6px rgba(0, 122, 255, .38);
    }
    .tabs button.on .mark { visibility: hidden; }

    .body { padding: 14px var(--pad-x) 16px; }
    .head .row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .head .row + .row { margin-top: 3px; align-items: baseline; }
    .head h1 {
      margin: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1 1 auto;
      font-size: 22px;
      line-height: 26px;
      font-weight: 650;
      letter-spacing: -0.04em;
    }
    .head .logo {
      width: 30px;
      height: 30px;
      color: var(--text);
    }
    .head h1 .name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .head .email,
    .head .sub,
    .head .plan {
      font-size: 13px;
      line-height: 18px;
      font-weight: 500;
      letter-spacing: .01em;
      color: var(--muted);
    }
    .head .email {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 52%;
    }
    .head .sub {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .head .sub.err { color: var(--hot); }
    .head .plan { white-space: nowrap; }
    .head .jump {
      appearance: none; border: 0; background: none; font: inherit;
      width: 100%; text-align: left; cursor: pointer; padding: 0; color: inherit;
    }
    .head .jump[disabled] { cursor: default; }

    .rule {
      height: 0.5px;
      background: var(--line);
      margin: 10px 0 14px;
    }
    .rule.mid { margin: 14px 0 16px; }

    .stack { display: flex; flex-direction: column; gap: 16px; }

    .meter { display: flex; flex-direction: column; gap: 6px; }
    .meter-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      row-gap: 2px;
      gap: 12px;
    }
    .meter-name {
      margin: 0;
      min-width: 0;
      font-size: 17px;
      line-height: 22px;
      font-weight: 600;
      letter-spacing: -0.03em;
    }
    .meter-local {
      flex: 1 1 180px;
      min-width: 0;
      margin: 0;
      font-size: 13px;
      line-height: 18px;
      font-weight: 500;
      letter-spacing: .005em;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
      text-align: right;
    }
    .local-sync {
      display: flex;
      min-height: 34px;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 2px;
      padding: 7px 9px;
      border: .5px solid var(--line);
      border-radius: 10px;
      background: color-mix(in srgb, var(--hover) 76%, var(--card));
      color: var(--muted);
      font-size: 12px;
      line-height: 18px;
      font-weight: 550;
    }
    .local-sync.is-error {
      border-color: color-mix(in srgb, var(--hot) 24%, var(--line));
      background: color-mix(in srgb, var(--hot) 6%, var(--card));
      color: var(--text);
    }
    .local-sync button {
      flex: 0 0 auto;
      min-height: 28px;
      appearance: none;
      border: 0;
      border-radius: 8px;
      padding: 4px 10px;
      background: var(--text);
      color: var(--card);
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }
    .local-sync button:disabled { cursor: wait; opacity: .62; }
    .bar {
      position: relative;
      height: 6px;
      border-radius: 99px;
      background: var(--track);
      overflow: hidden;
    }
    .bar.claude { background: color-mix(in srgb, var(--claude) 28%, var(--card)); }
    .bar.codex { background: color-mix(in srgb, var(--codex) 28%, var(--card)); }
    .bar.grok { background: color-mix(in srgb, var(--grok) 14%, var(--card)); }
    .bar .fill {
      display: block;
      width: 100%;
      height: 6px;
      border-radius: 99px;
      transform: scaleX(var(--fill, 0));
      transform-origin: left center;
    }
    .bar.codex .fill { background: var(--codex); }
    .bar.claude .fill { background: var(--claude); }
    .bar.grok .fill { background: var(--grok); }
    .meter-bot {
      display: flex;
      align-items: baseline;
      gap: 12px;
    }
    .meter-pct, .meter-reset {
      appearance: none; border: 0; background: none; font: inherit;
      cursor: pointer; padding: 0; color: var(--muted);
      min-height: 24px;
      font-size: 13px;
      font-weight: 500;
      line-height: 18px;
      letter-spacing: .005em;
      transition: color .2s var(--ease);
    }
    .meter-pct {
      flex: 0 0 auto;
      text-align: left;
      font-variant-numeric: tabular-nums;
    }
    .meter.is-empty .bar { opacity: .4; }
    .meter.is-empty .meter-pct {
      cursor: default;
      color: var(--faint);
    }
    .meter-pct:hover, .meter-reset:hover { color: var(--text); }
    .meter.is-empty .meter-pct:hover { color: var(--faint); }
    .meter-reset {
      min-width: 0;
      margin-left: auto;
      text-align: right;
      white-space: normal;
      font-variant-numeric: tabular-nums;
    }

    .cost { display: flex; flex-direction: column; gap: 10px; }
    .activity-stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      border: 0.5px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 4px;
    }
    .activity-stat {
      position: relative;
      min-width: 0;
      padding: 9px 5px 8px;
      text-align: center;
    }
    .activity-stat + .activity-stat::before {
      content: "";
      position: absolute;
      left: 0;
      top: 9px;
      bottom: 9px;
      width: 0.5px;
      background: var(--line);
    }
    .activity-stat b {
      display: block;
      overflow: hidden;
      font-size: 14px;

          <div class="row">
            <span class="sub${err ? " err" : ""}" data-stamp="${esc(accountKey(acc))}">${esc(stampLabel(acc))}</span>

        </${close}>

    function metersHtml(acc) {
      const list = (acc.windows || []).filter(w => w.used_percent != null);
      const five = list.find(w => w.label === "5h" || w.label === "primary");
      const week = list.find(w => w.label === "7d" || w.label === "weekly" || w.label === "30d");
      const extras = list.filter(w => w !== five && w !== week);
      const slots = [
        five || { label: "5h", missing: true },
        week || { label: "7d", missing: true },
        ...extras,
      ];
      return slots.map(w => meterHtml(acc, w)).join("");
    }

    function miniWins(acc) {
      const list = windowsOf(acc);
      const five = list.find(w => w.label === "5h" || w.label === "primary") || null;
      const week = list.find(w => w.label === "7d" || w.label === "weekly" || w.label === "30d") || null;
      return [five, week];
    }
    function miniLab(w, fallback) {
      if (!w || !w.label) return fallback;
      if (w.label === "primary") return "5h";
      if (w.label === "weekly") return "7d";
      return w.label;
    }
    function miniSlotHtml(w, p, lab, acc) {
      const unavailable = w && quotaWindowUnavailable(acc, w);

          : t(unavailable ? "notUpdated" : "noWindow");
        return `<span class="win is-empty" aria-label="${esc(`${lab} ${reason}`)}"><span class="lab">${esc(lab)}</span><span class="mini ${esc(p)}"></span></span>`;
      }
      const fill = Math.min(100, Math.max(0, fillWidth(w)));
      return `<span class="win" aria-label="${esc(`${lab} ${pctLabel(w)}`)}"><span class="lab">${esc(lab)}</span><span class="mini ${esc(p)}"><i style="--fill:${(fill / 100).toFixed(4)};background:var(--${esc(p)})"></i></span></span>`;
    }
    function accountRowHtml(a, p, currentId) {
      const who = identity(a) || a.account_id;
      const [five, week] = miniWins(a);
      const on = a.account_id === currentId ? " on" : "";
      const cancelLabel = t("cancelMonitoringAria", { provider: NAMES[p], account: who });
      const current = loggedIn(p);
      const isCurrent = Boolean(current && current.account_id === a.account_id);
      const cancel = isCurrent ? `<span class="account-monitor-spacer" aria-hidden="true"></span>` : `<button type="button" class="account-monitor-cancel" data-act="monitor-cancel" data-id="${esc(accountKey(a))}" aria-label="${esc(cancelLabel)}" title="${esc(cancelLabel)}">×</button>`;
      return `<div class="account-row-shell${isCurrent ? " is-current" : ""}">${cancel}<button type="button" class="account-pick${on}" data-act="pick" data-id="${esc(a.account_id)}"><span class="identity"><span class="who">${esc(who)}</span></span><span class="wins">${miniSlotHtml(five, p, miniLab(five, "5h"), a)}${miniSlotHtml(week, p, miniLab(week, "7d"), a)}</span></button></div>`;
    }
    function accountListHtml(p, viewing) {
      const allPeers = state.accounts.filter(a => a.provider === p);
      if (!allPeers.length) return "";
      const peers = allPeers.filter(isAccountMonitored);
      const hidden = allPeers.filter(a => !isAccountMonitored(a));
      const live = loggedIn(p);
      if (!live) return "";
      const monitoredLive = peers.find(a => a.account_id === live.account_id) || null;
      const rest = peers.filter(a => !monitoredLive || a.account_id !== monitoredLive.account_id);
      const open = state.switcher;
      const showDropdown = open || state.accountListMotion === "closing";
      const adding = state.monitorPickerProvider === p;
      const accountListId = `account-list-${esc(p)}`;
      const motionClass = state.accountListMotion === "opening"
        ? " is-opening"
        : state.accountListMotion === "closing" ? " is-closing" : "";
      const discloseIcon = `<svg class="disclose-chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg>`;
      const toggle = `<div class="account-list-head"><button type="button" class="disclose" data-act="switch" aria-expanded="${open ? "true" : "false"}"${showDropdown ? ` aria-controls="${accountListId}"` : ""}>${esc(t("accountList"))}<span class="n">${peers.length}</span>${discloseIcon}</button><button type="button" class="monitor-add-toggle" data-act="monitor-add-toggle" data-provider="${esc(p)}" aria-expanded="${adding ? "true" : "false"}">+ ${esc(t("addMonitoring"))}</button></div>`;
      const addPicker = adding ? `<div class="monitor-picker" role="region" aria-label="${esc(t("addMonitoring"))}"><div class="monitor-picker-title">${esc(t(hidden.length ? "addMonitoring" : "noCanceledMonitoring"))}</div>${hidden.map(a => {
        const who = identity(a) || a.account_id;
        return `<button type="button" class="monitor-restore" data-act="monitor-restore" data-id="${esc(accountKey(a))}" aria-label="${esc(t("restoreMonitoringAria", { provider: NAMES[p], account: who }))}"><span class="who">${esc(who)}</span><span class="restore-label">${esc(t("restoreMonitoring"))}</span></button>`;
      }).join("")}</div>` : "";
      if (!showDropdown) return `<div class="acc-wrap">${toggle}${addPicker}</div>`;
      const viewingId = viewing && viewing.account_id;
      const restHtml = rest.length
        ? `<div class="rest">${rest.map(a => accountRowHtml(a, p, viewingId)).join("")}</div>`
        : "";
      return `<div class="acc-wrap">${toggle}<div class="account-list-dropdown${motionClass}" id="${accountListId}" role="region" aria-label="${esc(t("accountList"))}"><div class="accs">
        ${monitoredLive ? `<div class="now"><div class="tag">${esc(t("currentLogin"))}</div>${accountRowHtml(monitoredLive, p, viewingId)}</div>` : ""}
        ${restHtml}
      </div></div>${addPicker}</div>`;
    }

    function unassignedHtml(provider) {
      const row = ((state.report && state.report.unassigned_by_provider) || [])
        .find(item => item.provider === provider);
      const value = spentTokens(row && row.usage);
      if (value <= 0) return "";
      const note = state.productMode.skill_required ? t("unassignedSkill") : t("unassignedHistory");
      return `<div class="history-help">
        <span class="history-label" tabindex="0" aria-describedby="unassigned-history-note">${esc(t("unassignedUsage", { value: compact(value) }))}</span>
        <p class="history-note" id="unassigned-history-note" role="tooltip">${esc(note)}</p>
      </div>`;
    }

    function telemetryTime(value) {
      if (!value) return t("notUpdated");
      const at = new Date(value);
      if (!Number.isFinite(at.getTime())) return t("notUpdated");
      return new Intl.DateTimeFormat(state.locale, {
        dateStyle: "medium",
        timeStyle: "short",
      }).format(at);
    }

    function telemetryEndpoint() {
      const configured = state.telemetry && state.telemetry.receiver && state.telemetry.receiver.endpoint;
      if (configured && /^https?:\/\//.test(configured)) return configured;
      const port = /^\d+$/.test(location.port) ? location.port : "7740";
      return configured ? `${location.protocol}//${location.host}${configured}` : `http://127.0.0.1:${port}/v1/logs`;
    }

    async function ensureTelemetryReceiver(provider = "") {
      const receiver = state.telemetry && state.telemetry.receiver;
      if (!receiver || receiver.manageable !== true) return true;
      if (receiver.state === "ready" && (!provider || receiver.providers?.[provider] === true)) return true;
      try {
        const response = await fetch("/api/telemetry-receiver", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(provider ? { enabled: true, provider } : { enabled: true }),
        });
        if (!response.ok) return false;
        const result = await response.json();
        if (result.receiver) state.telemetry.receiver = result.receiver;
        render();
        return result.ok === true && result.receiver && result.receiver.state === "ready" && (!provider || result.receiver.providers?.[provider] === true);
      } catch (_) {
        return false;
      }
    }

    async function disableTelemetryReceiver(provider = "") {
      const response = await fetch("/api/telemetry-receiver", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(provider ? { enabled: false, provider } : { enabled: false }),
      });
      if (!response.ok) return;
      const result = await response.json();
      if (result.receiver) state.telemetry.receiver = result.receiver;
      state.telemetryCopied = "";
      render();
    }

    function telemetryPsQuote(value) {
      return `'${String(value).replace(/'/g, "''")}'`;
    }

    function telemetryWindowsCli(names) {
      // PowerShell's `codex`/`claude`/`grok` often resolve to npm *.ps1
      // shims, which ExecutionPolicy blocks. Prefer Application (.cmd /
      // .exe) on PATH so the command is not bound to one install layout.
      const listed = names.map((name) => telemetryPsQuote(name)).join(", ");
      const tried = names.join(", ");
      return [
        `$cli = @(${listed}) | ForEach-Object { Get-Command $_ -CommandType Application -ErrorAction SilentlyContinue } | Select-Object -First 1`,
        `if (-not $cli) { throw 'official CLI not on PATH (tried ${tried})' }`,
      ];
    }

    function telemetryCommand(provider) {
      const endpoint = telemetryEndpoint();
      if (provider === "claude") {
        return telemetryWindowsCli(["claude.cmd", "claude.exe"]).concat([
          "$env:CLAUDE_CODE_ENABLE_TELEMETRY='1'",
          "$env:OTEL_LOGS_EXPORTER='otlp'",
          "$env:OTEL_EXPORTER_OTLP_LOGS_PROTOCOL='http/protobuf'",
          `$env:OTEL_EXPORTER_OTLP_LOGS_ENDPOINT=${telemetryPsQuote(endpoint)}`,
          "$env:OTEL_LOG_USER_PROMPTS='0'",
          "$env:OTEL_LOG_ASSISTANT_RESPONSES='0'",
          "$env:OTEL_LOG_TOOL_DETAILS='0'",
          "$env:OTEL_LOG_TOOL_CONTENT='0'",
          "$env:OTEL_LOG_RAW_API_BODIES='0'",
          "& $cli.Source",
        ]).join("; ");
      }
      if (provider === "grok") {
        return telemetryWindowsCli(["grok.cmd", "grok.exe"]).concat([
          "$env:GROK_EXTERNAL_OTEL='1'",
          "$env:OTEL_LOGS_EXPORTER='otlp'",
          "$env:OTEL_EXPORTER_OTLP_LOGS_PROTOCOL='http/protobuf'",
          `$env:OTEL_EXPORTER_OTLP_LOGS_ENDPOINT=${telemetryPsQuote(endpoint)}`,
          "$env:OTEL_LOG_USER_PROMPTS='0'",
          "$env:OTEL_LOG_TOOL_DETAILS='0'",
          "& $cli.Source",
        ]).join("; ");
      }
      const endpointFlag = telemetryPsQuote(
        `otel.exporter."otlp-http".endpoint=${endpoint}`
      );
      const protocolFlag = telemetryPsQuote(
        'otel.exporter."otlp-http".protocol=binary'
      );
      return telemetryWindowsCli(["codex.cmd", "codex.exe"]).concat([
        `& $cli.Source --config otel.exporter=otlp-http --config ${endpointFlag} --config ${protocolFlag} --config otel.log_user_prompt=false`,
      ]).join("; ");
    }

    function telemetrySetupHtml(provider) {
      if (state.telemetrySetup !== provider) return "";
      const copied = state.telemetryCopied === provider;
      const receiver = state.telemetry && state.telemetry.receiver;
      const providerEnabled = receiver && receiver.providers?.[provider] === true;
      const canDisable = receiver && receiver.manageable === true && providerEnabled;
      return `<div class="telemetry-setup" id="telemetry-${esc(provider)}-setup">
        <p class="telemetry-setup-title">${esc(t("telemetrySetupTitle", { provider: NAMES[provider] }))}</p>
        <p>${esc(t("telemetrySetupIntro"))}</p>
        <code class="telemetry-command">${esc(telemetryCommand(provider))}</code>
        <p>${esc(t("telemetryRestart"))}</p>
        <div class="telemetry-actions">
          <button type="button" data-act="telemetry-copy" data-provider="${esc(provider)}">${esc(t(copied ? "telemetryCopied" : "telemetryCopy"))}</button>
          <button type="button" data-act="telemetry-check">${esc(t("telemetryCheck"))}</button>
          ${canDisable ? `<button type="button" data-act="telemetry-disable" data-provider="${esc(provider)}">${esc(t("telemetryDisableProvider"))}</button>` : ""}
        </div>
      </div>`;
    }

    function telemetryHtml(provider) {
      const row = ((state.telemetry && state.telemetry.providers) || [])
        .find(item => item.provider === provider);
      if (!row) return "";
      const noteId = `telemetry-${provider}-note`;
      const last = telemetryTime(row.last_received_at);
      const receiver = state.telemetry && state.telemetry.receiver;
      const hasProviderControl = Boolean(
        receiver && receiver.manageable === true && receiver.providers
        && Object.prototype.hasOwnProperty.call(receiver.providers, provider)
      );
      const providerEnabled = hasProviderControl ? receiver.providers[provider] === true : true;
      let label = hasProviderControl
        ? t(providerEnabled ? "telemetryProviderEnabled" : "telemetryProviderOff", { provider: NAMES[provider] })
        : t("telemetryWaiting", { provider: NAMES[provider] });
      let note = hasProviderControl && !providerEnabled
        ? t("telemetryProviderOffNote", { provider: NAMES[provider] })
        : t("telemetryReadyNote", { provider: NAMES[provider] });
      if (receiver && receiver.state === "disabled") {
        label = t("telemetryReceiverOff");
        note = t("telemetryReceiverOffNote");
      } else if (receiver && receiver.state === "error") {
        label = t("telemetryReceiverError");
        note = t("telemetryReceiverErrorNote");
      } else if (hasProviderControl && !providerEnabled) {
        label = t("telemetryProviderOff", { provider: NAMES[provider] });
        note = t("telemetryProviderOffNote", { provider: NAMES[provider] });
      } else if (row.state === "traffic_only") {
        label = t("telemetryTraffic");
        note = t("telemetryTrafficNote", { provider: NAMES[provider], time: last });
      } else if (row.state === "usage_only") {
        label = t("telemetryUsageOnly");
        note = t("telemetryUsageOnlyNote", { provider: NAMES[provider], time: last });
      } else if (row.state === "identity_observed") {
        label = t("telemetryIdentity", { count: row.attributed_records });
        note = t("telemetryIdentityNote", { provider: NAMES[provider], time: last });
      }
      const open = state.telemetrySetup === provider;
      const receiverDisabled = receiver && receiver.state === "disabled";
      // The OTLP listener is shared, but each provider is an independent
      // switch. A click changes only this provider's persisted flag.
      const enabling = state.telemetryEnabling === provider;
      const enableAction = hasProviderControl && (!providerEnabled || receiverDisabled)
        ? `<button type="button" class="telemetry-enable" data-act="telemetry-enable" data-provider="${esc(provider)}"${enabling ? " disabled" : ""}>${esc(t(enabling ? "telemetryEnabling" : "telemetryEnable"))}</button>`
        : "";
      return `<div class="history-help telemetry-help ${esc(row.state)} ${esc(provider)}${open ? " open" : ""}">
        <div class="telemetry-status-row"><button type="button" class="history-label telemetry-trigger" data-act="telemetry-toggle" data-provider="${esc(provider)}" aria-expanded="${open ? "true" : "false"}" aria-controls="telemetry-${esc(provider)}-setup" aria-describedby="${esc(noteId)}"><i class="telemetry-dot" aria-hidden="true"></i>${esc(label)}</button>${enableAction}</div>
        <p class="history-note" id="${esc(noteId)}" role="tooltip">${esc(note)}</p>
        ${telemetrySetupHtml(provider)}
      </div>`;
    }

    function updateBadgeHtml() {
      const offer = state.update;
      if (!offer || !offer.version) return "";
      const icon = `<svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><g class="badge-arrow"><path d="M9 4v6.6"/><path d="m6.9 8.5 2.1 2.1 2.1-2.1"/></g><path d="M4.9 13.9h8.2"/></svg>`;
      const tip = t("updateTooltip", { version: offer.version });
      return `<span class="update-badge-wrap"><button type="button" class="update-badge" data-act="update-badge" aria-label="${esc(t("updateTitle", { version: offer.version }))}" aria-describedby="update-tooltip">${icon}</button><span id="update-tooltip" class="update-tooltip" role="tooltip">${esc(tip)}</span></span>`;
    }

    function announcementNotesHtml(notes) {
      const source = Array.isArray(notes) ? notes.join("\n") : String(notes == null ? "" : notes);
      const lines = source.replace(/\r\n?/g, "\n").split("\n");
      const out = [];
      let bullets = [];
      const flush = () => {
        if (!bullets.length) return;
        out.push(`<ul>${bullets.map(item => `<li>${esc(item)}</li>`).join("")}</ul>`);
        bullets = [];
      };
      for (const raw of lines) {
        const line = raw.trim();
        if (!line) { flush(); continue; }
        const bullet = line.match(/^(?:[-*•]|\u2022)\s+(.*)$/);
        if (bullet) { bullets.push(bullet[1]); continue; }
        flush();
        const heading = line.match(/^#{1,6}\s+(.+)$/) || line.match(/^([^。！？:：]{1,48})[:：]$/);
        if (heading) out.push(`<h3>${esc(heading[1])}</h3>`);
        else out.push(`<p>${esc(line)}</p>`);
      }
      flush();
      return out.join("");
    }

    function updateDialogHtml() {
      if (!state.announcementOpen && !state.updateDialogOpen) return "";
      if (state.announcementOpen && state.announcement && state.announcement.version) {
        const a = state.announcement;
        const titleId = "update-announcement-title";
        const bodyId = "update-announcement-body";
        return `<div class="update-dialog-backdrop"><section class="update-dialog" role="dialog" aria-modal="true" aria-labelledby="${titleId}" aria-describedby="${bodyId}"><div class="update-dialog-head"><h2 id="${titleId}">${esc(a.version)} ${esc(t("announcementTitle"))}</h2><button type="button" class="update-dialog-close" data-act="announcement-dismiss" aria-label="${esc(t("announcementClose"))}">×</button></div><div class="update-dialog-body" id="${bodyId}">${announcementNotesHtml(a.notes)}</div><div class="update-dialog-actions"><button type="button" class="update-dialog-primary" data-act="announcement-dismiss"${state.announcementDismissing ? ' disabled aria-busy="true"' : ""}>${esc(t("announcementDismiss"))}</button></div></section></div>`;
      }
      const offer = state.update;
      if (!offer || !offer.version) return "";
      const titleId = "update-confirm-title";
      const bodyId = "update-confirm-body";
      const error = state.updateError ? `<p class="update-dialog-error" role="alert">${esc(t("updateFailed"))}</p>` : "";
      return `<div class="update-dialog-backdrop"><section class="update-dialog" role="dialog" aria-modal="true" aria-labelledby="${titleId}" aria-describedby="${bodyId}"><div class="update-dialog-head"><h2 id="${titleId}">${esc(t("updateConfirmTitle"))}</h2><button type="button" class="update-dialog-close" data-act="update-cancel" aria-label="${esc(t("updateCancel"))}">×</button></div><div class="update-dialog-body" id="${bodyId}"><p>${esc(t("updateConfirmDescription", { version: offer.version }))}</p><p>${esc(t("updateCopy"))}</p>${error}</div><div class="update-dialog-actions"><button type="button" class="update-dialog-cancel" data-act="update-cancel"${state.updateApplying ? " disabled" : ""}>${esc(t("updateCancel"))}</button><button type="button" class="update-dialog-primary" data-act="apply-update"${state.updateApplying ? ' disabled aria-busy="true"' : ""}>${esc(t(state.updateApplying ? "updateApplying" : "updateInstallRestart"))}</button></div></section></div>`;
    }

    async function loadUpdate(force = false) {
      try {
        const response = await fetch(force ? "/api/update?force=1" : "/api/update");
        if (!response.ok) return;
        const offer = await response.json();
        state.update = offer && offer.version ? offer : null;
      } catch (_) {
        state.update = null;
      }
      render();
    }

    async function loadAnnouncement() {
      try {
        const response = await fetch("/api/update/announcement");
        if (!response.ok) return;
        const announcement = await response.json();
        if (announcement && announcement.version) {
          state.announcement = announcement;
          state.announcementOpen = true;
          state.updateDialogOpen = false;
          render();
          requestAnimationFrame(focusUpdateDialog);
        }
      } catch (_) {}
    }

    function dialogFocusable() {
      const dialog = document.querySelector(".update-dialog");
      return dialog ? Array.from(dialog.querySelectorAll("button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex='-1'])")) : [];
    }

    function focusUpdateDialog() {
      const dialog = document.querySelector(".update-dialog");
      if (!dialog) return;
      const buttons = dialogFocusable();
      (state.announcementOpen ? buttons[buttons.length - 1] : dialog.querySelector('[data-act="update-cancel"]'))?.focus();
    }

    function closeUpdateDialog() {
      if (state.announcementOpen) return dismissAnnouncement();
      state.updateDialogOpen = false;
      state.updateError = "";
      render();
      requestAnimationFrame(() => document.querySelector('[data-act="update-badge"]')?.focus());
    }

    async function dismissAnnouncement() {
      if (state.announcementDismissing || !state.announcement) return;
      const version = state.announcement.version;
      state.announcementDismissing = true;
      render();
      try {
        await fetch("/api/update/announcement/dismiss", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ version }),
        });
      } catch (_) {}
      state.announcementOpen = false;
      state.announcement = null;
      state.announcementDismissing = false;
      render();
      requestAnimationFrame(() => document.querySelector('[data-act="update-badge"]')?.focus() || document.querySelector('[data-act="app-menu"]')?.focus());
    }

    function openUpdateDialog() {
      if (state.announcementOpen || !state.update) return;
      state.appMenu = false;
      state.languageOptions = false;
      state.updateDialogOpen = true;
      state.updateError = "";
      render();
      requestAnimationFrame(focusUpdateDialog);
    }

    async function applyUpdate() {
      if (state.updateApplying || !state.update || !state.updateDialogOpen || state.announcementOpen) return;
      state.updateApplying = true;
      state.updateError = "";
      render();
      try {
        const response = await fetch("/api/update/apply", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ version: state.update.version }),
        });
        const result = response.ok ? await response.json() : { ok: false };
        if (result.ok) return;          // the panel is closing; leave it disabled
        state.updateError = String(result.error || "failed");
      } catch (_) {
        state.updateError = "failed";
      }
      state.updateApplying = false;
      render();
    }

    function runtimeWarningHtml() {
      const components = (state.diagnostics && state.diagnostics.components) || {};
      const issues = Object.values(components);
      const issue = issues.find((item) => item && item.status === "blocked_by_application_control") || issues[0];
      if (!issue) return "";
      const blocked = issue.status === "blocked_by_application_control";
      return `<div class="runtime-warning" role="status"><strong>${esc(t(blocked ? "runtimeBlockedTitle" : "runtimeComponentTitle"))}</strong>${esc(t(blocked ? "runtimeBlockedCopy" : "runtimeComponentCopy"))}</div>`;
    }

    function capability(provider, name) {
      return (((state.providers || {})[provider] || {})[name]) || {};
    }

    function hasLocalUsageEvidence() {
      return ["claude", "codex", "grok"].some(provider => capability(provider, "local_usage").available === true);
    }

    function localSyncHtml() {
      if (state.localRetrying) {
        return `<div class="local-sync" role="status" aria-live="polite"><span>${esc(t("localUsageRetrying"))}</span><button type="button" disabled>${esc(t("retry"))}</button></div>`;
      }
      if (state.loadingLocal && !state.localWindows.length) {

    function overviewPickerHtml() {
      if (!state.overviewPicker) return "";
      const shown = new Set(selectedOverviewIds());
      const groups = ["codex", "claude", "grok"].map(provider => {
        const live = loggedIn(provider);
        const accounts = monitoredAccounts(provider)
          .slice()
          .sort((a, b) => {
            if (live && a.account_id === live.account_id) return -1;
            if (live && b.account_id === live.account_id) return 1;
            return lastUsedMs(b) - lastUsedMs(a);
          });
        if (!accounts.length) return "";
        const rows = accounts.map(a => {
          const key = accountKey(a);
          const who = identity(a) || a.account_id;
          const isCurrent = !!(live && live.account_id === a.account_id);
          const isShown = shown.has(key);
          const statuses = [
            isCurrent ? `<span class="current">${esc(t("currentLogin"))}</span>` : "",
            isShown ? `<span>${esc(t("shownOnOverview"))}</span>` : "",
          ].join("");
          const aria = isShown
            ? t("shownAccountAria", { provider: NAMES[provider], account: who })
            : t("addAccountAria", { provider: NAMES[provider], account: who });
          return `<button type="button" data-act="overview-add" data-id="${esc(key)}" aria-label="${esc(aria)}"${isShown ? " disabled" : ""}>
            <span class="who">${esc(who)}</span>
            <span class="overview-account-status">${statuses}</span>
          </button>`;

          <div class="overview-provider-head"><span class="logo ${esc(provider)}" aria-hidden="true"></span><span>${esc(NAMES[provider])}</span><span class="count">${accounts.length}</span></div>

    function tabMark(t) {
      if (t === "overview") return `<span class="mark"></span>`;

      const win = acc ? tightest(acc) : null;
      if (!win) return `<span class="mark ${esc(t)}"></span>`;
      const fill = fillWidth(win);
      const color = getComputedStyle(document.documentElement).getPropertyValue("--" + t).trim() || "#888";
      return `<span class="mark ${esc(t)}"><i style="--fill:${(fill / 100).toFixed(4)};background:${esc(color)}"></i></span>`;

        const on = state.tab === provider ? " on" : "";
        const icon = `<span class="logo ${provider === "overview" ? "sandglass" : provider}"></span>`;
        return `<button type="button" data-tab="${provider}" class="${on}" aria-label="${esc(label)}" aria-current="${on ? "page" : "false"}" title="${esc(label)}">${icon}<span class="tab-label">${esc(label)}</span>${tabMark(provider)}</button>`;
      }).join("");

    function renderCard() {
      const card = document.getElementById("card");
      const menu = document.getElementById("menu");
      const accountScrollTop = card.querySelector(".accs")?.scrollTop || 0;
      if (state.help) {
        card.innerHTML = helpHtml();
        menu.innerHTML = menuRow("help-back", MENU_ICO.back, t("back"));
        return;
      }
      if (state.tab === "overview") {
        card.innerHTML = overviewHtml();
        menu.innerHTML = menuHtml();
        requestAnimationFrame(sizeOverviewCards);
        return;
      }
      if (state.hardError && !state.accounts.length) {
        card.innerHTML = navigator.onLine === false
          ? `<div class="empty"><p class="empty-title">${esc(t("offlineTitle"))}</p><p class="empty-copy">${esc(t("offlineCopy"))}</p></div>`
          : `<div class="empty"><p class="empty-title">${esc(t("quotaUnavailableTitle"))}</p><p class="empty-copy">${esc(t("quotaUnavailableCopy"))}</p></div>`;
        menu.innerHTML = menuHtml();
        return;
      }
      if (!state.accounts.length) {
        const p = state.tab;
        if (capability(p, "local_usage").available === true) {
          card.innerHTML = `<div class="head"><div class="row"><h1><span class="logo ${esc(p)}" aria-hidden="true"></span><span class="name">${esc(NAMES[p])}</span></h1></div><div class="row"><span class="sub">${esc(t("signedOut"))}</span></div></div>

          menu.innerHTML = menuHtml();
          return;
        }
        card.innerHTML = state.loadingQuota
          ? `<div class="skel" aria-hidden="true"><div class="sk t"></div><div class="sk s"></div><div class="rule"></div><div class="sk h"></div><div class="sk bar"></div><div class="sk s"></div><div class="sk h"></div><div class="sk bar"></div></div>`
          : state.overviewScan === "idle" && !state.lastOkAt
            ? `<div class="empty"><p class="empty-title">${esc(t("notScannedTitle"))}</p><p class="empty-copy">${esc(t("notScannedCopy"))}</p></div>`
            : `<div class="empty"><p class="empty-title">${esc(t("noLocalLoginTitle"))}</p><p class="empty-copy">${esc(t("noLocalLoginCopy"))}</p></div>`;
        menu.innerHTML = menuHtml();
        return;
      }

      const p = state.tab;
      const acc = viewed(p);
      if (!acc) {
        card.innerHTML = `<div class="head"><div class="row"><h1><span class="logo ${esc(p)}" aria-hidden="true"></span><span class="name">${esc(NAMES[p])}</span></h1></div><div class="row"><span class="sub">${esc(t("signedOut"))}</span></div></div>
          <div class="empty"><p class="empty-title">${esc(t("providerNoLoginTitle"))}</p><p class="empty-copy">${esc(t("providerNoLoginCopy"))}</p></div>
          ${unassignedHtml(p)}
          ${telemetryHtml(p)}`;
        menu.innerHTML = menuHtml();
        return;

      const accountScroller = card.querySelector(".accs");
      if (accountScroller) accountScroller.scrollTop = accountScrollTop;
      menu.innerHTML = menuHtml();

    function render() {
      if (!["overview", "codex", "claude", "grok"].includes(state.tab)) state.tab = "overview";
      if (state.productModeLoaded && !state.productMode.selected) {
        state.tab = "overview";
        state.help = false;
      }
      applyLocale();
      const updateDialogOpen = state.announcementOpen || state.updateDialogOpen;
      document.body.classList.toggle("update-dialog-open", updateDialogOpen);
      document.documentElement.classList.toggle("overview-mode", state.tab === "overview" && !state.help);
      document.body.classList.toggle("overview-mode", state.tab === "overview" && !state.help);
      document.getElementById("app-menu").innerHTML = appMenuHtml();
      document.getElementById("update-dialog-root").innerHTML = updateDialogHtml();
      document.getElementById("runtime-warning").innerHTML = runtimeWarningHtml();
      document.getElementById("autostart-nudge").innerHTML = autostartNudgeHtml();
      renderTabs();
      renderCard();
      for (const child of document.querySelector(".popover").children) {
        if (child.id === "update-dialog-root") continue;
        child.inert = updateDialogOpen;
        if (updateDialogOpen) child.setAttribute("aria-hidden", "true");
        else child.removeAttribute("aria-hidden");
      }

    function renderTabChange() {
      if (renderTabChange.timer) clearTimeout(renderTabChange.timer);
      render();
      const targets = [document.getElementById("card"), document.getElementById("menu")];
      for (const target of targets) {
        target.classList.remove("tab-enter");
        void target.offsetWidth;
        target.classList.add("tab-enter");
      }
      renderTabChange.timer = setTimeout(() => {
        targets.forEach(target => target.classList.remove("tab-enter"));
        renderTabChange.timer = 0;
      }, 220);

    function clearAccountListMotionTimer() {
      if (accountListMotionTimer) {
        clearTimeout(accountListMotionTimer);
        accountListMotionTimer = null;
      }
    }

    function toggleAccountList() {
      clearAccountListMotionTimer();
      const open = !state.switcher;
      state.switcher = open;
      state.monitorPickerProvider = "";
      if (!open) revertView(state.tab);
      const motion = reduceMotion ? "" : open ? "opening" : "closing";
      state.accountListMotion = motion;
      render();
      if (open) {
        state.accountListMotion = "";
        if (motion) {
          accountListMotionTimer = setTimeout(() => {
            accountListMotionTimer = null;
          }, 260);
        }
      } else if (motion) {
        accountListMotionTimer = setTimeout(() => {
          accountListMotionTimer = null;
          state.accountListMotion = "";
          render();
        }, 220);
      } else {
        state.accountListMotion = "";
      }
    }

    async function loadQuota(onboarding) {
      if (state.loadingQuota && !onboarding) return;
      const previousAccountKeys = new Set(state.accounts.map(accountKey));
      const hadOverviewCards = selectedOverviewAccounts().length > 0;
      const scanController = new AbortController();
      const scanTimeout = setTimeout(() => scanController.abort(), 20000);
      if (onboarding) {
        state.overviewScan = "scanning";
        setOverviewNotice("");
      }
      const seq = ++state.quotaSeq;
      state.loadingQuota = true;
      const prevLogin = loginIds();
      render();
      try {
        const response = await fetch("/api/quota", { signal: scanController.signal });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        if (seq !== state.quotaSeq) return;
        if (!data || !Array.isArray(data.accounts)) throw new Error("invalid quota payload");
        state.accounts = data.accounts;
        state.providers = data.providers || {};
        followLoginChange(prevLogin);
        state.lastOkAt = Date.now();
        state.stale = false;
        state.hardError = false;
        if (onboarding) {
          state.overviewScan = "done";
          state.overviewEmptyScans = state.accounts.length ? 0 : state.overviewEmptyScans + 1;
          if (hadOverviewCards) {
            const newlyFound = state.accounts.filter(a => !previousAccountKeys.has(accountKey(a))).length;
            setOverviewNotice(newlyFound
              ? t("foundNewAccounts", { count: newlyFound })
              : t("noNewAccounts"));
            if (newlyFound) state.overviewPicker = true;
          }
        }
      } catch (e) {
        if (seq !== state.quotaSeq) return;
        if (state.accounts.length) state.stale = true;
        else state.hardError = true;
        if (onboarding) {
          state.overviewScan = "error";
          if (hadOverviewCards) setOverviewNotice(t("scanRetryNotice"));
        }
      } finally {
        if (scanTimeout) clearTimeout(scanTimeout);
        if (seq !== state.quotaSeq) return;
        state.loadingQuota = false;
        render();
        if (state.accounts.length || hasLocalUsageEvidence()) {
          const quotaMoved = state.accounts.some((acc) => {
            const at = Date.parse(acc.quota_fetched_at || "");
            return Number.isFinite(at) && at > state.localAt;
          });
          refreshUsageData(quotaMoved);
        }
        loadTelemetry(false);
        if (onboarding && state.overviewScan === "done") startPoll();
      }
    }

    function waitFor(ms) {
      return new Promise(resolve => window.setTimeout(resolve, ms));
    }

    function loadLocalWindows(force, userInitiated = false) {
      if (!force && state.localWindows.length && Date.now() - state.localAt < 30000) {
        return Promise.resolve(true);
      }
      if (localLoadPromise) return localLoadPromise;
      state.loadingLocal = true;
      state.localRetrying = userInitiated;
      render();
      localLoadPromise = (async () => {
        const delays = [700, 1800];
        for (let attempt = 0; attempt <= delays.length; attempt += 1) {
          const controller = new AbortController();
          const timeout = window.setTimeout(() => controller.abort(), 15000);
          try {
            const response = await fetch("/api/local-windows", { signal: controller.signal });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            if (!data || !Array.isArray(data.accounts)) throw new Error("invalid local usage payload");
            state.localWindows = data.accounts;
            state.localAt = Date.now();
            state.localError = false;
            return true;
          } catch (e) {
            if (attempt === delays.length) {
              state.localError = true;
              return false;
            }
            await waitFor(delays[attempt]);
          } finally {
            window.clearTimeout(timeout);
          }
        }
        return false;
      })().finally(() => {
        state.loadingLocal = false;
        state.localRetrying = false;
        localLoadPromise = null;
        render();
      });
      return localLoadPromise;
    }

    async function refreshUsageData(force, userInitiated = false) {
      await loadLocalWindows(force, userInitiated);
      await loadReport(force);
    }

    async function loadReport(force) {
      if (state.loadingReport) return;
      if (!force && state.report && Date.now() - state.reportAt < 60000) return;
      state.loadingReport = true;
      render();
      try {
        const response = await fetch("/api/report?since=30d");
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        if (!data || typeof data !== "object") throw new Error("invalid report payload");
        state.report = data;
        state.reportAt = Date.now();
      } catch (e) {
      } finally {
        state.loadingReport = false;
        render();
      }
    }

    async function loadTelemetry(force) {
      if (state.loadingTelemetry) return;
      if (!force && state.telemetry && Date.now() - state.telemetryAt < 20000) return;
      state.loadingTelemetry = true;
      try {
        const response = await fetch("/api/telemetry-status");
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        state.telemetry = await response.json();
        state.telemetryAt = Date.now();
      } catch (e) {
      } finally {
        state.loadingTelemetry = false;
        render();
      }
    }

    async function loadRuntimeDiagnostics() {
      try {
        const response = await fetch("/api/runtime-diagnostics");
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        state.diagnostics = await response.json();
      } catch (e) {
      } finally {
        render();
      }
    }

    function dismissFloatingMenus(ev) {
      let changed = false;
      if (state.appMenu && !ev.__sandglassAppMenuAction && !ev.target.closest(".app-menu-shell") && !ev.target.closest('[data-act="app-menu"]')) {
        state.appMenu = false;
        state.languageOptions = false;
        changed = true;
      }
      const opensOverviewPicker = ev.target.closest(
        '[data-act="overview-toggle"], [data-act="overview-guide-add"]',
      );
      if (state.overviewPicker && !ev.target.closest(".overview-picker") && !opensOverviewPicker) {
        state.overviewPicker = false;
        changed = true;
      }
      const opensMonitorPicker = ev.target.closest('[data-act="monitor-add-toggle"]');
      if (state.monitorPickerProvider && !ev.target.closest(".monitor-picker") && !opensMonitorPicker) {
        state.monitorPickerProvider = "";
        changed = true;
      }
      if (state.telemetrySetup && !ev.target.closest(".telemetry-help")) {
        state.telemetrySetup = "";
        state.telemetryCopied = "";
        changed = true;
      }
      if (changed) render();
    }

    document.addEventListener("mousedown", (ev) => {
      if (ev.button !== 0) return;
      const interactive = ev.target.closest("button,a,input,select,textarea,label,[role='button'],[data-act],[data-tab]");
      if (!interactive) dismissFloatingMenus(ev);
    }, true);

    document.querySelector(".popover").addEventListener("click", (ev) => {
      const tabBtn = ev.target.closest("[data-tab]");
      const act = ev.target.closest("[data-act]");
      if (act && act.closest(".app-menu-shell")) ev.__sandglassAppMenuAction = true;
      const action = act && act.getAttribute("data-act");
      if (action === "apply-update") {
        applyUpdate();
        return;
      }
      if (action === "update-badge") {
        openUpdateDialog();
        return;
      }
      if (action === "update-cancel") {
        closeUpdateDialog();
        return;
      }
      if (action === "announcement-dismiss") {
        dismissAnnouncement();
        return;
      }
      if (tabBtn) {
        state.help = false;
        if (state.tab !== tabBtn.getAttribute("data-tab")) revertView(state.tab);
        clearAccountListMotionTimer();
        state.accountListMotion = "";
        state.tab = tabBtn.getAttribute("data-tab");
        state.switcher = false;
        state.monitorPickerProvider = "";
        state.telemetrySetup = "";
        writeStore("sandglass.ui.tab", state.tab);
        renderTabChange();
        requestAnimationFrame(focusActiveTab);
        return;
      }
      if (!act) return;
      const kind = action;
      if (kind === "app-menu") {
        state.appMenu = !state.appMenu;
        if (state.appMenu) state.overviewPicker = false;
        else state.languageOptions = false;
        render();
        if (state.appMenu) requestAnimationFrame(() => {
          revealSelectedLanguage();
          focusFirstAppMenuItem();
        });
        else requestAnimationFrame(focusAppMenuButton);
      } else if (kind === "language-toggle") {
        state.languageOptions = !state.languageOptions;
        render();
        requestAnimationFrame(() => document.querySelector('[data-act="language-toggle"]')?.focus());
      } else if (kind === "help-open") {
        state.appMenu = false;
        state.languageOptions = false;
        state.help = true;
        state.helpAdvanced = false;
        renderTabChange();
        requestAnimationFrame(focusHelpView);
      } else if (kind === "help-advanced") {
        state.helpAdvanced = !state.helpAdvanced;
        renderTabChange();
        requestAnimationFrame(() => document.querySelector('[data-act="help-advanced"]')?.focus());
      } else if (kind === "mode-change") {
        state.appMenu = false;
        state.languageOptions = false;
        state.help = false;
        state.productModeError = false;
        state.productModeBeforeEdit = { ...state.productMode };
        state.productMode = { selected: false, attribution_mode: "", skill_required: false };
        state.tab = "overview";
        renderTabChange();
      } else if (kind === "mode-reload") {
        loadProductMode().then(() => {
          if (state.productMode.selected) {
            loadQuota();
            startPoll();
          }
        });
      } else if (kind === "mode-cancel") {
        if (state.productModeBeforeEdit) state.productMode = state.productModeBeforeEdit;
        state.productModeBeforeEdit = null;
        renderTabChange();
      } else if (kind === "help-back") {
        state.help = false;
        state.helpAdvanced = false;
        renderTabChange();
        requestAnimationFrame(focusAppMenuButton);
      } else if (kind === "adapter-skill-copy") {
        const done = () => {
          state.adapterSkillCopied = true;
          renderTabChange();
          window.setTimeout(() => {
            state.adapterSkillCopied = false;
            if (state.help) renderTabChange();
          }, 1800);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(adapterSkillPrompt()).then(done).catch(() => {});
        }
      } else if (kind === "language") {
        const locale = I18N.resolve(act.getAttribute("data-locale"));
        state.locale = locale;
        state.appMenu = false;
        state.languageOptions = false;
        setOverviewNotice("");
        writeStore("sandglass.ui.language", locale);
        render();
        requestAnimationFrame(focusAppMenuButton);
      } else if (kind === "polarity") {
        state.polarity = state.polarity === "left" ? "used" : "left";
        writeStore("sandglass.ui.polarity", state.polarity);
        render();
      } else if (kind === "reset") {
        state.resetMode = state.resetMode === "countdown" ? "clock" : "countdown";
        writeStore("sandglass.ui.reset", state.resetMode);
        render();
      } else if (kind === "activity-range") {
        const range = act.getAttribute("data-range");
        if (["all", "30", "7"].includes(range)) {
          state.activityRange = range;
          writeStore("sandglass.ui.activityRange", range);
          render();
        }
      } else if (kind === "refresh") {
        loadQuota();
        refreshUsageData(true);
        loadTelemetry(true);
        loadRuntimeDiagnostics();
      } else if (kind === "local-retry") {
        refreshUsageData(true, true);
      } else if (kind === "telemetry-toggle") {
        const provider = act.getAttribute("data-provider");
        state.telemetrySetup = state.telemetrySetup === provider ? "" : provider;
        state.telemetryCopied = "";
        render();
      } else if (kind === "telemetry-enable") {
        const provider = act.getAttribute("data-provider");
        if (!provider || state.telemetryEnabling) return;
        state.telemetryEnabling = provider;
        state.telemetrySetup = provider;
        state.telemetryCopied = "";
        render();
        ensureTelemetryReceiver(provider).then(() => {
          state.telemetryEnabling = "";
          loadTelemetry(true);
          render();
        }).catch(() => {
          state.telemetryEnabling = "";
          loadTelemetry(true);
          render();
        });
      } else if (kind === "telemetry-copy") {
        const provider = act.getAttribute("data-provider");
        ensureTelemetryReceiver().then((ready) => {
          if (!ready) {
            loadTelemetry(true);
            return;
          }
          return navigator.clipboard.writeText(telemetryCommand(provider));
        }).then((copied) => {
          if (copied === undefined && state.telemetry && state.telemetry.receiver && state.telemetry.receiver.state !== "ready") return;
          state.telemetryCopied = provider;
          if (telemetryCopyTimer) clearTimeout(telemetryCopyTimer);
          telemetryCopyTimer = setTimeout(() => {
            state.telemetryCopied = "";
            render();
          }, 1600);
          render();
        }).catch(() => {});
      } else if (kind === "telemetry-check") {
        loadTelemetry(true);
      } else if (kind === "telemetry-disable") {
        disableTelemetryReceiver(act.getAttribute("data-provider") || "").catch(() => {});
      } else if (kind === "switch") {
        toggleAccountList();
      } else if (kind === "pick") {
        const id = act.getAttribute("data-id");
        const live = loggedIn(state.tab);
        if (live && id === live.account_id) revertView(state.tab);
        else state.chosen[state.tab] = id;
        render();
      } else if (kind === "overview-toggle") {
        setOverviewNotice("");
        if (state.overviewPicker) closeOverviewPickerAndRestoreFocus();
        else openOverviewPicker();
      } else if (kind === "overview-mode") {
        const mode = act.getAttribute("data-mode");
        if (mode === "default" || mode === "custom") {
          if (mode === "custom") startOverviewCustomizing();
          state.overviewMode = mode;
          state.overviewPicker = false;
          writeStore("sandglass.ui.overviewMode", mode);
          render();
        }
      } else if (kind === "overview-scan") {
        state.overviewPicker = false;
        loadQuota(true);
      } else if (kind === "mode-single") {
        chooseProductMode("single_official");
      } else if (kind === "mode-skill") {
        chooseProductMode("skill_assisted");
      } else if (kind === "overview-guide-add") {
        openOverviewPicker();
      } else if (kind === "overview-add") {
        startOverviewCustomizing();
        setOverviewNotice("");
        const id = act.getAttribute("data-id");
        if (id && !state.overviewIds.includes(id)) state.overviewIds.push(id);
        saveOverviewIds();
        state.overviewPicker = false;
        render();
        requestAnimationFrame(focusOverviewPickerOpener);
      } else if (kind === "overview-remove") {
        startOverviewCustomizing();
        const id = act.getAttribute("data-id");
        state.overviewIds = state.overviewIds.filter(key => key !== id);
        saveOverviewIds();
        render();
      } else if (kind === "monitor-add-toggle") {
        const provider = act.getAttribute("data-provider") || "";
        state.monitorPickerProvider = state.monitorPickerProvider === provider ? "" : provider;
        state.overviewPicker = false;
        render();
      } else if (kind === "monitor-cancel") {
        const id = act.getAttribute("data-id");
        if (id && !state.hiddenMonitorIds.includes(id)) state.hiddenMonitorIds.push(id);
        writeListStore("sandglass.ui.hiddenMonitorAccounts", state.hiddenMonitorIds);
        if (state.overviewIds) {
          state.overviewIds = state.overviewIds.filter(key => key !== id);
          saveOverviewIds();
        }
        for (const provider of Object.keys(state.chosen)) {
          if (`${provider}:${state.chosen[provider]}` === id) delete state.chosen[provider];
        }
        render();
      } else if (kind === "monitor-restore") {
        const id = act.getAttribute("data-id");
        state.hiddenMonitorIds = state.hiddenMonitorIds.filter(key => key !== id);
        writeListStore("sandglass.ui.hiddenMonitorAccounts", state.hiddenMonitorIds);
        state.monitorPickerProvider = "";
        render();
      } else if (kind === "autostart-enable") {
        enableDesktopAutostart();
      } else if (kind === "autostart-later") {
        state.autostartPromptDismissed = true;
        sessionStorage.setItem("sandglass.ui.autostartDismissed", "1");
        render();
      }
    });
    document.addEventListener("click", dismissFloatingMenus);
    document.addEventListener("keydown", (ev) => {
      if (state.announcementOpen || state.updateDialogOpen) {
        if (ev.key === "Escape") {
          ev.preventDefault();
          if (state.announcementOpen) dismissAnnouncement();
          else closeUpdateDialog();
          return;
        }
        if (ev.key === "Tab") {
          const focusable = dialogFocusable();
          if (!focusable.length) return;
          const current = focusable.indexOf(document.activeElement);
          let next = ev.shiftKey ? current - 1 : current + 1;
          if (current < 0) next = 0;
          if (next < 0) next = focusable.length - 1;
          if (next >= focusable.length) next = 0;
          ev.preventDefault();
          focusable[next].focus();
          return;
        }
        return;
      }
      const menuItem = ev.target.closest('#app-menu-panel [role^="menuitem"]');
      if (state.appMenu && menuItem && ["ArrowDown", "ArrowUp", "Home", "End"].includes(ev.key)) {
        ev.preventDefault();
        const options = Array.from(document.querySelectorAll('#app-menu-panel [role^="menuitem"]'));
        const current = options.indexOf(menuItem);
        let next = current;
        if (ev.key === "ArrowDown") next = (current + 1) % options.length;
        else if (ev.key === "ArrowUp") next = (current - 1 + options.length) % options.length;
        else if (ev.key === "Home") next = 0;
        else if (ev.key === "End") next = options.length - 1;
        options[next]?.focus();
        options[next]?.scrollIntoView({ block: "nearest" });
        return;
      }
      if (ev.key === "Escape" && state.appMenu && state.languageOptions) {
        ev.preventDefault();
        state.languageOptions = false;
        render();
        requestAnimationFrame(() => document.querySelector('[data-act="language-toggle"]')?.focus());
        return;
      }
      if (ev.key === "Escape" && state.appMenu) {
        ev.preventDefault();
        closeAppMenuAndRestoreFocus();
        return;
      }
      if (ev.key === "Escape" && state.help) {
        ev.preventDefault();
        state.help = false;
        renderTabChange();
        requestAnimationFrame(focusAppMenuButton);
        return;
      }
      if (ev.key === "Escape" && state.overviewPicker) {
        ev.preventDefault();
        closeOverviewPickerAndRestoreFocus();
        return;
      }
      if (ev.key === "Escape" && state.telemetrySetup) {
        ev.preventDefault();
        state.telemetrySetup = "";
        state.telemetryCopied = "";
        render();
        return;
      }
      if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === "r") {
        ev.preventDefault();
        loadQuota();
        refreshUsageData(true, true);
        loadTelemetry(true);
        loadRuntimeDiagnostics();
      }
    });
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden && (state.lastOkAt || selectedOverviewIds().length)) loadQuota();
    });
    const POLL_MS = 20000;
    const UPDATE_POLL_MS = 6 * 60 * 60 * 1000;
    let poll = null;
    let updatePoll = null;
    let stampTick = null;
    function startPoll() {
      if (poll) clearInterval(poll);
      poll = setInterval(loadQuota, POLL_MS);
      if (!stampTick) stampTick = setInterval(paintStamps, 1000);
    }
    function startUpdatePoll() {
      if (updatePoll) clearInterval(updatePoll);
      updatePoll = setInterval(() => {
        if (!state.updateApplying && !state.updateDialogOpen && !state.announcementOpen) loadUpdate(true);
      }, UPDATE_POLL_MS);
    }
    render();
    loadUpdate();
    loadAnnouncement();
    startUpdatePoll();
    loadProductMode().then(() => {
      if (state.productMode.selected) {
        loadQuota();
        startPoll();
      }
    });
    loadTelemetry(false);
    loadRuntimeDiagnostics();
    window.addEventListener("pywebviewready", loadDesktopAutostart);
    setTimeout(loadDesktopAutostart, 250);
  </script>
</body>
</html>
