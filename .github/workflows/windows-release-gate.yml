name: Windows release gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13.15"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[desktop]"
      - name: Prepare official WebView2 runtime
        shell: pwsh
        run: ./tools/build_native_shell.ps1
      - name: Run unit and boundary tests
        shell: pwsh
        run: |
          $env:SANDGLASS_NATIVE_SHELL = "$env:GITHUB_WORKSPACE\native\SandglassShell\bin"
          python -m unittest discover -s tests

  installed-wheel:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13.15"
      - name: Build wheel
        run: |
          python -m pip install --disable-pip-version-check -r tools/wheel-build-requirements.txt
          python -m build --wheel
      - name: Scan release contents and write checksums
        run: python -m tools.release_artifact --dist dist
      - name: Install wheel in an empty environment
        shell: pwsh
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP "sandglass-wheel-smoke"
          python -m venv $smokeRoot
          $smokePython = Join-Path $smokeRoot "Scripts\python.exe"
          $wheel = (Get-ChildItem "$env:GITHUB_WORKSPACE\dist\sandglass-*.whl" | Select-Object -First 1).FullName
          & $smokePython -m pip install --disable-pip-version-check $wheel
          Push-Location $env:RUNNER_TEMP
          try {
            & $smokePython "$env:GITHUB_WORKSPACE\tests\smoke_installed.py"
          } finally {
            Pop-Location
          }
      - name: Preserve verified wheel and checksum
        uses: actions/upload-artifact@v4
        with:
          name: sandglass-wheel-${{ github.sha }}
          path: |
            dist/sandglass-*.whl
            dist/SHA256SUMS
          if-no-files-found: error

  windows-bundle:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13.15"
      - name: Install pinned desktop and bundle dependencies
        run: |
          python -m pip install --disable-pip-version-check -e ".[desktop]"
          python -m pip install --disable-pip-version-check -r tools/windows-release-requirements.txt
      - name: Prepare pinned NSIS compiler
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "nsis-3.12-setup.exe"
          $compiler = Join-Path $env:RUNNER_TEMP "nsis-3.12"
          & curl.exe -L --fail --silent --show-error `
            "https://sourceforge.net/projects/nsis/files/NSIS%203/3.12/nsis-3.12-setup.exe/download" `
            -o $installer
          if ($LASTEXITCODE -ne 0) { throw "NSIS download failed." }
          $expected = "3BC2B06253A7E4957111BE152AC6A536E0C7478A706E19DA814038DB5D706495"
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne $expected) {
            throw "NSIS 3.12 download hash mismatch."
          }
          $process = Start-Process -FilePath $installer `
            -ArgumentList @("/S", "/D=$compiler") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS install failed." }
          "SANDGLASS_MAKENSIS=$(Join-Path $compiler 'makensis.exe')" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build and smoke unsigned Windows candidates
        shell: pwsh
        run: ./tools/build_windows_release.ps1 -NsisCompiler $env:SANDGLASS_MAKENSIS
      - name: Launch packaged desktop and open native panel
        shell: pwsh
        run: ./tools/smoke_windows_bundle.ps1 -Bundle ./dist/Sandglass
      - name: Preserve verified unsigned candidates
        uses: actions/upload-artifact@v4
        with:
          name: sandglass-windows-unsigned-${{ github.sha }}
          path: |
            dist/Sandglass-*-windows-x64-unsigned-portable.zip
            dist/Sandglass-*-windows-x64-unsigned-setup.exe
            dist/Sandglass-*-windows-x64-runtime.cdx.json
            dist/SHA256SUMS.windows
          if-no-files-found: error
      - name: Export uninstaller for the inner SignPath request
        shell: pwsh
        run: ./tools/prepare_windows_signing.ps1 -NsisCompiler $env:SANDGLASS_MAKENSIS
      - name: Upload inner unsigned signing payload
        id: upload-inner-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: sandglass-windows-inner-unsigned-${{ github.sha }}
          path: |
            dist/Sandglass
            build/windows-signing-request/Uninstall.exe
          if-no-files-found: error
      - name: Submit inner Authenticode signing
        id: sign-inner
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SIGNPATH_ORGANIZATION_ID != '' && secrets.SIGNPATH_API_TOKEN != '' }}
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: windows-inner
          github-artifact-id: ${{ steps.upload-inner-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-inner
          wait-for-completion-timeout-in-seconds: 1800
      - name: Build unsigned outer installer from signed inner files
        if: ${{ steps.sign-inner.outcome == 'success' }}
        shell: pwsh
        run: |
          $archive = Join-Path $env:GITHUB_WORKSPACE "signed-inner.zip"
          if (Test-Path -LiteralPath "signed-inner\Sandglass\Sandglass.exe") {
            Compress-Archive -Path "signed-inner\Sandglass","signed-inner\Uninstall.exe" `
              -DestinationPath $archive -Force
          } else {
            throw "Signed inner payload is missing Sandglass.exe"
          }
          ./tools/build_signed_nsis.ps1 -SignedInnerArchive $archive `
            -NsisCompiler $env:SANDGLASS_MAKENSIS `
            -OutputDirectory "build/windows-signed-installer"
      - name: Upload unsigned outer installer
        id: upload-outer-unsigned
        if: ${{ steps.sign-inner.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: sandglass-windows-outer-unsigned-${{ github.sha }}
          path: build/windows-signed-installer/Sandglass-*-windows-x64-unsigned-outer-setup.exe
          if-no-files-found: error
      - name: Submit outer Authenticode signing
        id: sign-outer
        if: ${{ steps.sign-inner.outcome == 'success' && vars.SIGNPATH_ORGANIZATION_ID != '' && secrets.SIGNPATH_API_TOKEN != '' }}
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: windows-outer
          github-artifact-id: ${{ steps.upload-outer-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-outer
          wait-for-completion-timeout-in-seconds: 1800
      - name: Smoke the signed installer
        if: ${{ steps.sign-outer.outcome == 'success' }}
        shell: pwsh
        run: |
          $installer = Get-ChildItem "signed-outer\Sandglass-*-windows-x64-unsigned-outer-setup.exe" |
            Select-Object -First 1
          if (-not $installer) {
            $installer = Get-ChildItem "signed-outer\*.exe" | Select-Object -First 1
          }
          if (-not $installer) { throw "Signed outer installer is missing." }
          ./tools/smoke_windows_installer.ps1 -Installer $installer.FullName -RequireSigned
      - name: Preserve signed installer
        if: ${{ steps.sign-outer.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: sandglass-windows-signed-${{ github.sha }}
          path: signed-outer
          if-no-files-found: error
